<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DECK-01 // Directive Log</title>
<style>
/* Phosphor colour: swap these three lines for amber */
:root{--fg:#3dff72;--dim:#1f9b43;--bg:#041108;--warn:#ffb000;--crit:#ff5240;--line:#145c28}
/* AMBER: --fg:#ffb000;--dim:#a06c00;--bg:#130c00;--warn:#ffe27a;--crit:#ff5240;--line:#5c3d00 */
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{font-family:"VT323","Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;font-size:clamp(14px,3.1vh,22px);color:var(--fg)}

/* Plastic bezel + curved glass */
.bezel{width:100vw;height:100vh;padding:1.6vmin;background:radial-gradient(ellipse at 50% 40%,#2a2a26,#0d0d0b 80%)}
.crt{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,var(--bg) 0%,#000 120%);
  border-radius:13% / 20%;
  box-shadow:inset 0 0 7vmin 2.5vmin #000,inset 0 0 1.5vmin .3vmin #000,0 0 0 .5vmin #000}
/* vignette: darkens toward the edges so the glass looks like it bulges */
.crt::before{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;border-radius:inherit;
  background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(0,0,0,.35) 68%,rgba(0,0,0,.85) 100%)}
/* glass glare + very faint scanlines */
.crt::after{content:"";position:absolute;inset:0;z-index:21;pointer-events:none;border-radius:inherit;
  background:radial-gradient(ellipse 38% 22% at 24% 11%,rgba(255,255,255,.10),transparent 70%),
             radial-gradient(ellipse 22% 14% at 82% 90%,rgba(255,255,255,.04),transparent 70%),
             repeating-linear-gradient(to bottom,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}

.content{position:absolute;inset:0;padding:7% 9% 6.5%;display:flex;flex-direction:column;gap:.45em;text-shadow:0 0 .35em var(--dim)}
.top,.pathrow,.bar{display:flex;align-items:center;gap:.7em}
.top{justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:.2em;letter-spacing:.08em}
.pathrow{color:var(--dim)} #path{color:var(--fg);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button,input,select{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--dim);padding:.1em .6em;min-height:1.9em;text-shadow:inherit;border-radius:0}
button{cursor:pointer;letter-spacing:.05em} button:active,button:focus-visible{background:var(--fg);color:#000;outline:none;text-shadow:none}
button:disabled{opacity:.3;cursor:default}
.bar{flex-wrap:wrap}

.list{flex:1;overflow-y:auto;border-top:1px solid var(--line);padding-top:.2em;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.row{display:flex;align-items:center;gap:.6em;padding:.2em .1em;border-bottom:1px dotted var(--line)}
.row.dir{cursor:pointer} .row.dir:active{background:var(--line)}
.tag{color:var(--warn)} .nm{flex:1} .meta{color:var(--dim)}
.body{flex:1;min-width:0} .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--dim);font-size:.78em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.done .tt{text-decoration:line-through;color:var(--dim)}
.p-PRIORITY .pri{color:var(--warn)} .p-CRITICAL .pri{color:var(--crit)}
.over .cd{color:var(--crit);animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}
.empty{color:var(--dim);padding:.8em 0}
@media (prefers-reduced-motion:reduce){.over .cd{animation:none}}

.panel{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center}
.panel[hidden]{display:none}
.form{width:76%;display:flex;flex-direction:column;gap:.5em;text-shadow:0 0 .35em var(--dim)}
.form label{display:flex;flex-direction:column;color:var(--dim);font-size:.85em}
.form input,.form select{width:100%;color-scheme:dark;background:#000}
.form .btns{display:flex;gap:.7em;margin-top:.3em}
h2{margin:0;font-weight:normal;letter-spacing:.1em;border-bottom:1px solid var(--line)}

/* block cursor for text fields */
#nText,#dName{text-transform:uppercase}
.cur{position:relative;display:block}
.cur input{caret-color:transparent}
.cur i{position:absolute;top:50%;width:.6em;height:1.1em;margin-top:-.55em;background:var(--fg);box-shadow:0 0 .4em var(--dim);pointer-events:none;animation:cblink 1s steps(1,end) infinite;display:none}
.cur input:focus + i{display:block}
@keyframes cblink{50%{opacity:0}}
/* typed-out text and status line */
.typing::after,.prompt::after{content:"";display:inline-block;width:.55em;height:1em;margin-left:.15em;vertical-align:-.12em;background:var(--fg);animation:cblink 1s steps(1,end) infinite}
.prompt{color:var(--dim);min-height:1.5em;padding-top:.2em;white-space:nowrap;overflow:hidden}
.sub.hide{visibility:hidden}
/* list refresh when changing folder or sort */
.sweep{animation:sweep .3s steps(8) 1}
@keyframes sweep{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
/* slow rolling brightness band */
.roll{position:absolute;left:0;right:0;height:24%;top:-30%;z-index:19;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.04),transparent);animation:roll 9s linear infinite}
@keyframes roll{to{top:115%}}
#pBoot{justify-content:flex-start;align-items:flex-start;padding:13% 12%;cursor:pointer}
#bootTxt{line-height:1.35;text-shadow:0 0 .35em var(--dim)}
@media (prefers-reduced-motion:reduce){.roll,.sweep,.cur i,.prompt::after,.typing::after{animation:none}}

body.amber{--fg:#ffb000;--dim:#a06c00;--bg:#130c00;--warn:#ffe27a;--line:#5c3d00}
#clock{cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.row button{padding:.1em .45em}
.st{color:var(--fg)} .s-HOLD .st{color:var(--warn)} .s-DONE .st{color:var(--dim)} .s-ACTIVE .st{text-shadow:0 0 .6em var(--fg)}
.alertc{color:var(--crit);text-shadow:0 0 .5em var(--crit);animation:blink 1s steps(2,start) infinite}
/* completion effects */
.spark{position:absolute;z-index:15;pointer-events:none;color:var(--fg);text-shadow:0 0 .5em var(--fg);animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.crt.win .content{animation:pulse .5s ease-out}
@keyframes pulse{from{filter:brightness(1.9)}to{filter:brightness(1)}}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:16;pointer-events:none;text-align:center;letter-spacing:.12em;
  border:2px solid var(--fg);background:rgba(0,0,0,.85);padding:.45em 1.5em;box-shadow:0 0 1.2em var(--dim),inset 0 0 .8em var(--line);text-shadow:0 0 .5em var(--fg);white-space:nowrap}
.banner .b2{color:var(--warn);font-size:.85em;min-height:1em}
.banner.out{opacity:0;transition:opacity .45s}
@media (prefers-reduced-motion:reduce){.crt.win .content{animation:none}}
</style>
</head>
<body>
<div class="bezel"><div class="crt">
  <div class="content">
    <div class="top"><span id="title">DECK-01 // DIRECTIVE LOG</span><span id="rank" class="meta"></span><span id="clock" title="Tap to switch colour"></span></div>
    <div class="pathrow"><button id="up" title="Parent folder">..</button><span id="path"></span><span id="stat"></span></div>
    <div class="bar"><button id="sort"></button><button id="addT">+ DIRECTIVE</button><button id="addD">+ FOLDER</button><button id="snd"></button></div>
    <div class="list" id="list"></div>
    <div class="prompt" id="msg"></div>
  </div>

  <div class="roll"></div>
  <div class="panel" id="pBoot"><div id="bootTxt"></div></div>

  <div class="panel" id="pDir" hidden><div class="form">
    <h2>NEW FOLDER</h2>
    <label>NAME<div class="cur"><input id="dName" maxlength="24" autocomplete="off"><i></i></div></label>
    <div class="btns"><button id="dSave">CREATE</button><button id="dCancel">CANCEL</button></div>
  </div></div>

  <div class="panel" id="pNew" hidden><div class="form">
    <h2 id="nTitle">NEW DIRECTIVE</h2>
    <label>DESCRIPTION<div class="cur"><input id="nText" maxlength="80" autocomplete="off"><i></i></div></label>
    <label>DUE (OPTIONAL)<input id="nDue" type="datetime-local"></label>
    <div class="two"><label>PRIORITY<select id="nPri"><option>ROUTINE</option><option>PRIORITY</option><option>CRITICAL</option></select></label><label>STATUS<select id="nSt"><option>OPEN</option><option>ACTIVE</option><option>HOLD</option><option>DONE</option></select></label></div>
    <div class="btns"><button id="nSave">SAVE</button><button id="nCancel">CANCEL</button></div>
  </div></div>

  <div class="panel" id="pMove" hidden><div class="form">
    <h2>MOVE DIRECTIVE</h2>
    <label>DESTINATION<select id="mDest"></select></label>
    <div class="btns"><button id="mSave">MOVE</button><button id="mCancel">CANCEL</button></div>
  </div></div>
</div></div>

<script>
(() => {
  const KEY = 'deck01.directives.v1';
  const $ = id => document.getElementById(id);
  const pad = (n, l = 2) => String(n).padStart(l, '0');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const local = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const SORTS = ['SORT: DUE SOONEST', 'SORT: DUE LATEST', 'SORT: ENTRY ORDER'];
  let fresh = null, ac, editing = null;
  const GL = { OPEN: '[ ]', ACTIVE: '[>]', HOLD: '[!]', DONE: '[X]' };
  const RANKS = [[0, 'CREWMAN'], [50, 'TECHNICIAN'], [150, 'SPECIALIST'], [300, 'OFFICER'], [600, 'COMMANDER'], [1000, 'CAPTAIN']];
  const rank = xp => RANKS.filter(r => xp >= r[0]).pop()[1];
  const st = t => t.status || (t.done ? 'DONE' : 'OPEN');
  const setStatus = (t, v) => { t.status = v; t.done = v === 'DONE'; };
  const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  function tone(f, at, dur, vol) {
    if (!S.snd) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + at;
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur);
    } catch (e) {}
  }
  const chime = big => (big ? [523, 659, 784, 1047, 1319] : [523, 659, 784]).forEach((f, i) => tone(f, i * 0.09, 0.14, 0.03));
  function sparks(el) {
    if (still()) return;
    const crt = document.querySelector('.crt'), cr = crt.getBoundingClientRect(), r = el.getBoundingClientRect();
    const x = r.left - cr.left + r.width / 2, y = r.top - cr.top + r.height / 2, ch = ['+', '*', '\u25AA', '\u00B7'];
    for (let i = 0; i < 16; i++) {
      const sp = document.createElement('span'), a = Math.random() * 6.283, d = 40 + Math.random() * 80;
      sp.className = 'spark'; sp.textContent = ch[i % 4];
      sp.style.left = x + 'px'; sp.style.top = y + 'px';
      sp.style.setProperty('--dx', Math.cos(a) * d + 'px'); sp.style.setProperty('--dy', Math.sin(a) * d + 'px');
      crt.appendChild(sp); setTimeout(() => sp.remove(), 900);
    }
  }
  function flash() { const c = document.querySelector('.crt'); c.classList.remove('win'); void c.offsetWidth; c.classList.add('win'); setTimeout(() => c.classList.remove('win'), 600); }
  function banner(a, b) {
    const crt = document.querySelector('.crt'), el = document.createElement('div');
    el.className = 'banner'; el.innerHTML = '<div class="b1"></div><div class="b2"></div>'; el.lastChild.textContent = b;
    crt.appendChild(el); typeOut(el.firstChild, a, 24);
    setTimeout(() => el.classList.add('out'), 1800); setTimeout(() => el.remove(), 2300);
  }
  function win(t, el) {
    let gain = 0, up = null;
    if (!t.paid) {
      t.paid = true; gain = { ROUTINE: 10, PRIORITY: 20, CRITICAL: 40 }[t.pri] + (t.due && new Date(t.due) > Date.now() ? 10 : 0);
      const before = rank(S.xp || 0); S.xp = (S.xp || 0) + gain;
      if (rank(S.xp) !== before) up = rank(S.xp);
    }
    sparks(el); flash(); chime(!!up);
    banner(up ? 'RANK UP: ' + up : 'DIRECTIVE COMPLETE', gain ? '+' + gain + ' XP' : 'ALREADY LOGGED');
    say('DIRECTIVE DIR-' + pad(t.id, 4) + ' CLOSED. LOG ENTRY SAVED.');
  }
  function openEdit(id) {
    const t = S.tasks.find(x => x.id === id); if (!t) return;
    editing = id; $('nTitle').textContent = 'EDIT DIRECTIVE';
    $('nText').value = t.text; $('nDue').value = t.due || ''; $('nPri').value = t.pri; $('nSt').value = st(t);
    $('pNew').hidden = false; $('nText').focus(); $('nText').dispatchEvent(new Event('input'));
  }

  function blip() {
    if (!S.snd) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.value = 850 + Math.random() * 250; g.gain.value = 0.01;
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.02);
    } catch (e) {}
  }
  function typeOut(el, text, ms, done, beep) {
    clearInterval(el._t); let i = 0; el.textContent = ''; el.classList.add('typing');
    el._t = setInterval(() => {
      if (!el.isConnected) { clearInterval(el._t); return; }
      i++; el.textContent = text.slice(0, i);
      if (beep && text[i - 1] !== ' ') blip();
      if (i >= text.length) { clearInterval(el._t); el.classList.remove('typing'); if (done) done(); }
    }, ms);
  }
  const say = txt => typeOut($('msg'), '> ' + txt, 16);
  function sweep() { const l = $('list'); l.classList.remove('sweep'); void l.offsetWidth; l.classList.add('sweep'); }
  function blockCursor(inp) {
    const c = document.createElement('canvas').getContext('2d'), blk = inp.nextElementSibling;
    const upd = () => {
      const cs = getComputedStyle(inp); c.font = cs.fontSize + ' ' + cs.fontFamily;
      const w = c.measureText(inp.value.slice(0, inp.selectionStart).toUpperCase()).width;
      blk.style.left = (parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth) + w - inp.scrollLeft) + 'px';
    };
    ['input', 'keydown', 'keyup', 'click', 'focus', 'select'].forEach(ev => inp.addEventListener(ev, () => requestAnimationFrame(upd)));
    upd();
  }
  function boot() {
    const box = $('bootTxt'), LINES = ['DECK-01 FIRMWARE 2.1', 'MEMORY CHECK ........ OK', 'DISPLAY .............. OK', 'RADIO LINK ..... OFFLINE', 'MOUNTING DIRECTIVE LOG ..', 'READY.'];
    let i = 0, over = false;
    const end = () => { if (over) return; over = true; $('pBoot').hidden = true; say('AWAITING INPUT.'); };
    $('pBoot').addEventListener('click', end);
    document.addEventListener('keydown', end, { once: true });
    (function next() {
      if (over) return;
      if (i >= LINES.length) { setTimeout(end, 500); return; }
      const line = document.createElement('div'); box.appendChild(line);
      typeOut(line, '> ' + LINES[i++], 10, () => setTimeout(next, 110));
    })();
  }

  function load() { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return null; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  const now = Date.now();
  let S = load() || {
    seq: 3, fseq: 1, sort: 0, cwd: 'root',
    folders: [{ id: 'f1', name: 'WORK', parent: 'root' }],
    tasks: [
      { id: 1, text: 'CHECK ANTENNA MOUNT', due: local(new Date(now + 36e5 * 30)), pri: 'PRIORITY', done: false, folder: 'root' },
      { id: 2, text: 'ORDER LORA RADIOS', due: '', pri: 'ROUTINE', done: false, folder: 'f1' }
    ]
  };

  if (S.snd === undefined) S.snd = true;
  const sub = id => [id, ...S.folders.filter(f => f.parent === id).flatMap(f => sub(f.id))];
  const openCount = id => { const ids = sub(id); return S.tasks.filter(t => !t.done && ids.includes(t.folder)).length; };
  function pathOf(id) {
    const p = [];
    while (id !== 'root') { const f = S.folders.find(x => x.id === id); if (!f) break; p.unshift(f.name); id = f.parent; }
    return '/' + p.join('/');
  }

  function countdown(t) {
    if (t.done) return { txt: 'CLOSED', over: false };
    if (!t.due) return { txt: 'NO DEADLINE', over: false };
    let ms = new Date(t.due) - Date.now(); const over = ms < 0; ms = Math.abs(ms);
    const m = Math.floor(ms / 6e4), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
    const s = d ? `${d}D ${pad(h)}H` : `${pad(h)}:${pad(m % 60)}`;
    return { txt: (over ? 'OVERDUE ' : 'T-') + s, over };
  }

  function cmp(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (S.sort === 2) return a.id - b.id;
    const ad = a.due ? +new Date(a.due) : Infinity, bd = b.due ? +new Date(b.due) : Infinity;
    if (ad === Infinity || bd === Infinity) return ad === bd ? a.id - b.id : (ad === Infinity ? 1 : -1);
    return S.sort === 0 ? ad - bd : bd - ad;
  }

  function render() {
    $('path').textContent = pathOf(S.cwd);
    $('up').disabled = S.cwd === 'root';
    $('sort').textContent = SORTS[S.sort];
    $('snd').textContent = 'SND: ' + (S.snd ? 'ON' : 'OFF');
    const open = S.tasks.filter(t => !t.done).length;
    const ids = sub(S.cwd), here = S.tasks.filter(t => ids.includes(t.folder));
    const pct = here.length ? Math.round(here.filter(t => t.done).length / here.length * 100) : 0, nb = Math.round(pct / 10);
    $('stat').textContent = open + ' OPEN  [' + '\u2588'.repeat(nb) + '\u2591'.repeat(10 - nb) + '] ' + (here.length ? pct + '%' : '--');
    $('rank').textContent = rank(S.xp || 0) + ' ' + (S.xp || 0) + 'XP';
    const al = S.tasks.some(t => !t.done && t.pri === 'CRITICAL' && t.due && new Date(t.due) < Date.now());
    $('title').textContent = al ? '!! ALERT: CRITICAL OVERDUE !!' : 'DECK-01 // DIRECTIVE LOG';
    $('title').className = al ? 'alertc' : '';

    const dirs = S.folders.filter(f => f.parent === S.cwd).sort((a, b) => a.name.localeCompare(b.name));
    const tasks = S.tasks.filter(t => t.folder === S.cwd).sort(cmp);
    let h = '';
    for (const f of dirs) h += `<div class="row dir" data-act="open" data-id="${f.id}"><span class="tag">[DIR]</span><span class="nm">${esc(f.name)}/</span><span class="meta">${openCount(f.id)} OPEN</span><button data-act="rm" data-id="${f.id}">RM</button></div>`;
    for (const t of tasks) {
      const c = countdown(t);
      h += `<div class="row task p-${t.pri} s-${st(t)}${t.done ? ' done' : ''}${c.over ? ' over' : ''}">
        <button data-act="tog" data-id="${t.id}">${GL[st(t)]}</button>
        <div class="body"><div class="tt"${t.id === fresh ? ` data-type="${esc(t.text)}"` : ''}>${t.id === fresh ? '' : esc(t.text)}</div>
        <div class="sub${t.id === fresh ? ' hide' : ''}">DIR-${pad(t.id, 4)} <span class="pri">${t.pri}</span> <span class="st">${st(t)}</span> ${t.due ? 'DUE ' + t.due.replace('T', ' ') : ''} <span class="cd">${c.txt}</span></div></div>
        <button data-act="ed" data-id="${t.id}">ED</button><button data-act="mv" data-id="${t.id}">MV</button><button data-act="del" data-id="${t.id}">DEL</button></div>`;
    }
    $('list').innerHTML = h || '<div class="empty">NO ENTRIES. ADD A DIRECTIVE OR FOLDER.</div>';
    const ft = $('list').querySelector('[data-type]');
    if (fresh !== null && ft) {
      const id = fresh;
      ft.scrollIntoView({ block: 'nearest' });
      typeOut(ft, ft.dataset.type, 45, () => { fresh = null; ft.nextElementSibling.classList.remove('hide'); say('DIRECTIVE DIR-' + pad(id, 4) + ' LOGGED.'); }, true);
    } else fresh = null;
  }

  let moving = null;
  $('list').addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === 'open') { S.cwd = id; sweep(); say('ACCESSING ' + pathOf(id)); }
    else if (act === 'tog') {
      const t = S.tasks.find(x => x.id == id), next = { OPEN: 'ACTIVE', ACTIVE: 'DONE', HOLD: 'ACTIVE', DONE: 'OPEN' }[st(t)];
      setStatus(t, next);
      if (next === 'DONE') win(t, el); else say('DIRECTIVE DIR-' + pad(t.id, 4) + ' STATUS: ' + next);
    }
    else if (act === 'del') { if (confirm('DELETE THIS DIRECTIVE?')) { S.tasks = S.tasks.filter(x => x.id != id); say('DIRECTIVE PURGED.'); } }
    else if (act === 'rm') {
      const f = S.folders.find(x => x.id === id), ids = sub(id);
      if (confirm(`DELETE ${f.name}/ AND EVERYTHING INSIDE IT?`)) {
        S.folders = S.folders.filter(x => !ids.includes(x.id));
        S.tasks = S.tasks.filter(x => !ids.includes(x.folder));
        say('FOLDER ' + f.name + ' PURGED.');
      }
    }
    else if (act === 'ed') { openEdit(+id); return; }
    else if (act === 'mv') {
      moving = +id;
      const opts = [{ id: 'root', p: '/' }, ...S.folders.map(f => ({ id: f.id, p: pathOf(f.id) }))].sort((a, b) => a.p.localeCompare(b.p));
      $('mDest').innerHTML = opts.map(o => `<option value="${o.id}">${esc(o.p)}</option>`).join('');
      $('mDest').value = S.tasks.find(x => x.id === moving).folder;
      $('pMove').hidden = false; return;
    }
    save(); render();
  });

  $('up').onclick = () => { const f = S.folders.find(x => x.id === S.cwd); S.cwd = f ? f.parent : 'root'; sweep(); say('ACCESSING ' + pathOf(S.cwd)); save(); render(); };
  $('sort').onclick = () => { S.sort = (S.sort + 1) % 3; sweep(); save(); render(); };
  $('addD').onclick = () => { $('dName').value = ''; $('pDir').hidden = false; $('dName').focus(); };
  const saveDir = () => {
    const n = $('dName').value.trim().toUpperCase().slice(0, 24);
    if (!n) { $('dName').focus(); return; }
    S.folders.push({ id: 'f' + (++S.fseq + 100), name: n, parent: S.cwd });
    $('pDir').hidden = true; save(); render(); say('DIRECTORY ' + n + ' CREATED.');
  };
  $('dSave').onclick = saveDir;
  $('dName').addEventListener('keydown', e => { if (e.key === 'Enter') saveDir(); });
  $('dCancel').onclick = () => { $('pDir').hidden = true; };
  $('addT').onclick = () => { editing = null; $('nTitle').textContent = 'NEW DIRECTIVE'; $('nText').value = ''; $('nDue').value = ''; $('nPri').value = 'ROUTINE'; $('nSt').value = 'OPEN'; $('pNew').hidden = false; $('nText').focus(); };
  const saveTask = () => {
    const text = $('nText').value.trim().toUpperCase(); if (!text) { $('nText').focus(); return; }
    if (editing !== null) {
      const t = S.tasks.find(x => x.id === editing);
      if (t) { t.text = text; t.due = $('nDue').value; t.pri = $('nPri').value; setStatus(t, $('nSt').value); say('DIRECTIVE DIR-' + pad(t.id, 4) + ' UPDATED.'); }
      editing = null;
    } else {
    const id = ++S.seq;
    const t = { id, text, due: $('nDue').value, pri: $('nPri').value, folder: S.cwd };
    setStatus(t, $('nSt').value); S.tasks.push(t);
    fresh = id;
    }
    $('pNew').hidden = true; save(); render();
  };
  $('nSave').onclick = saveTask;
  $('nText').addEventListener('keydown', e => { if (e.key === 'Enter') saveTask(); });
  $('nCancel').onclick = () => { editing = null; $('pNew').hidden = true; };
  $('mSave').onclick = () => { S.tasks.find(x => x.id === moving).folder = $('mDest').value; $('pMove').hidden = true; save(); render(); say('DIRECTIVE MOVED TO ' + pathOf($('mDest').value)); };
  $('mCancel').onclick = () => { $('pMove').hidden = true; };

  const tick = () => { const d = new Date(); $('clock').textContent = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  tick(); render();
  blockCursor($('nText')); blockCursor($('dName'));
  if (S.theme === 'amber') document.body.classList.add('amber');
  $('clock').onclick = () => { S.theme = document.body.classList.toggle('amber') ? 'amber' : 'green'; save(); };
  $('snd').onclick = () => { S.snd = !S.snd; save(); render(); blip(); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { $('pBoot').hidden = true; say('AWAITING INPUT.'); } else boot();
  setInterval(tick, 1000);
  setInterval(() => { if ($('pNew').hidden && $('pMove').hidden && $('pDir').hidden && fresh === null) render(); }, 30000);
})();
</script>
</body>
</html>
